name: CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install
        run: npm ci

      - name: Server tests
        run: npm test

      - name: Mobile typecheck
        run: npm run typecheck

      - name: Mobile lint
        run: npm run lint
